<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 32">
  <defs>
    <!-- Starts at the left edge and runs along x; the rotation turns it to run
         down the left square, red at the top, blue at the bottom. -->
    <linearGradient id="turned" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="30" y2="0" gradientTransform="rotate(90)">
      <stop offset="0" stop-color="#e02020"/>
      <stop offset="1" stop-color="#2040e0"/>
    </linearGradient>
    <!-- A round gradient squashed to half its height: the ellipse reaches the
         top and bottom of the circle halfway, and the rest is the padded edge. -->
    <radialGradient id="squashed" gradientUnits="userSpaceOnUse" cx="48" cy="16" r="14" gradientTransform="translate(48 16) scale(1 0.5) translate(-48 -16)">
      <stop offset="0" stop-color="#fff070"/>
      <stop offset="1" stop-color="#108040"/>
    </radialGradient>
  </defs>
  <rect x="1" y="1" width="30" height="30" fill="url(#turned)"/>
  <circle cx="48" cy="16" r="14" fill="url(#squashed)"/>
</svg>
