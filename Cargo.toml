[workspace]
resolver = "2"

[package]
name = "waterui-svg"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/svg"
description = "SVG rendering for WaterUI using the Cherenkov engine"
keywords = ["svg", "graphics", "waterui", "cherenkov"]
categories = ["gui"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[features]
# No text support by default: every known consumer of this crate draws icon
# geometry (`Svg::from_path`, `Svg::from_stroke_path`, icon sets), and the
# parser this crate uses carries no font database, so `usvg/text` would pull
# `fontdb`, `rustybuzz` and the `unicode-*` crates into every application for a
# code path that cannot produce a glyph. See README.md for the full table.
default = []
# Lay `<text>` out into outline paths. This is the only usvg feature that
# affects what this crate draws: with it off the parser drops `<text>`
# outright, with it on the text becomes the flattened outline group the
# renderer already draws. Enabling it also unlocks the font-taking
# constructors, which are the only way to give the parser a font to lay text
# out with.
text = ["usvg/text"]
# The mounted-runtime tests in `tests/e2e_semantics.rs`. They mount through
# `waterui-testing`, which pulls `hydrolysis` — and no hydrolysis or
# hydrolysis-m3 revision compiles against the pinned waterui revision yet
# (both still implement the retired `Scene2D` contract), so this target is
# the one piece of the crate that does not build under `--all-features`.
# When a hydrolysis revision lands that implements the new `SceneContent`
# contract, declare the host dev-deps below and this builds.
host-e2e = []

[dependencies]
waterui-core = "0.5.0"
waterui-macros = "0.5.0"
waterui-graphics = { version = "0.5.0", features = ["gpu"] }
waterui-layout = "0.5.0"
suiteki = { version = "0.1", features = ["nami"] }
tracing = "0.1.44"
# usvg's default features are `text`, `system-fonts` and `memmap-fonts`. The
# last two only widen `fontdb` (filesystem and fontconfig scanning,
# memory-mapped faces), and this crate never asks `fontdb` to read a file: it
# is handed a database or it parses with an empty one. They are off with no
# effect on output; see the feature table in README.md.
usvg = { version = "0.48.1", default-features = false }
cherenkov = "0.0.0"

[dev-dependencies]
# The `cpu` feature adds the `OffscreenRenderer<Raster>` the snapshot tests
# compare the GPU render against.
waterui-graphics = { version = "0.5.0", features = ["cpu"] }

# Dev-deps for the `host-e2e` feature — absent on purpose: every available
# hydrolysis / hydrolysis-m3 revision still implements `Scene2D` and cannot
# compile against the pinned waterui, so declaring any of them would poison
# the dev graph for every test target. Restore them, pinned to the revision
# the host port produces, when it lands:
#
#   waterui = "0.5.0"
#   waterui-testing = "0.5.0"
#   hydrolysis-m3 = "0.3.0"

[package.metadata.cargo-machete]
ignored = ["waterui-macros"]

# Registry dependencies do not carry their own patch table, so the framework's
# pins are repeated here for this graph to resolve the same sources as
# water-rs/waterui `dev` at the pinned revision: every `waterui-*` crate this
# crate reaches, directly or transitively, is the same monorepo commit, and
# the engine trio is the Cherenkov revision the port targets.
[patch.crates-io]
waterui-core = { git = "https://github.com/water-rs/waterui", rev = "8fd2a851f18beb65cdc3f586b9c979ff2134e042" }
waterui-graphics = { git = "https://github.com/water-rs/waterui", rev = "8fd2a851f18beb65cdc3f586b9c979ff2134e042" }
waterui-layout = { git = "https://github.com/water-rs/waterui", rev = "8fd2a851f18beb65cdc3f586b9c979ff2134e042" }
waterui-macros = { git = "https://github.com/water-rs/waterui", rev = "8fd2a851f18beb65cdc3f586b9c979ff2134e042" }

cherenkov = { git = "https://github.com/water-rs/cherenkov", rev = "8d00976e5a68f3ac2e99d9265d3246b1a7c29ad6" }
cherenkov-cpu = { git = "https://github.com/water-rs/cherenkov", rev = "8d00976e5a68f3ac2e99d9265d3246b1a7c29ad6" }
cherenkov-gpu = { git = "https://github.com/water-rs/cherenkov", rev = "8d00976e5a68f3ac2e99d9265d3246b1a7c29ad6" }
filtrate = { git = "https://github.com/water-rs/cherenkov", rev = "8d00976e5a68f3ac2e99d9265d3246b1a7c29ad6" }
filtrate-core = { git = "https://github.com/water-rs/cherenkov", rev = "8d00976e5a68f3ac2e99d9265d3246b1a7c29ad6" }
filtrate-derive = { git = "https://github.com/water-rs/cherenkov", rev = "8d00976e5a68f3ac2e99d9265d3246b1a7c29ad6" }

# The nami `kurbo` feature Cherenkov requires is unreleased (water-rs/nami#27);
# this revision is the one the pinned monorepo declares, and it contains the
# engine's own pin, so one nami serves both.
nami = { git = "https://github.com/water-rs/nami", rev = "f1db5017f5d64cb45b9b304c74ff420377258476" }
nami-core = { git = "https://github.com/water-rs/nami", rev = "f1db5017f5d64cb45b9b304c74ff420377258476" }

# Third-party forks the framework itself patches.
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }
block = { git = "https://github.com/Dicklesworthstone/rust-block", rev = "b39ae859d1ee8e8cb5eef6a516471f1578d26b96" }
