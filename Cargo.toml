[package]
name = "waterui-svg"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/svg"
description = "SVG rendering for WaterUI using Vello"
keywords = ["svg", "graphics", "waterui", "vello"]
categories = ["gui"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[features]
# No text support by default: every known consumer of this crate draws icon
# geometry (`Svg::from_path`, `Svg::from_stroke_path`, icon sets), and the
# parser this crate uses carries no font database, so `usvg/text` would pull
# `fontdb`, `rustybuzz` and the `unicode-*` crates into every application for a
# code path that cannot produce a glyph. See README.md for the full table.
default = []
# Lay `<text>` out into outline paths. This is the only usvg feature that
# affects what this crate draws: with it off the parser drops `<text>`
# outright, with it on the text becomes the flattened outline group the
# renderer already draws. Enabling it also unlocks the font-taking
# constructors, which are the only way to give the parser a font to lay text
# out with.
text = ["usvg/text"]

[dependencies]
waterui-core = { version = "0.3.0", git = "https://github.com/water-rs/waterui.git", branch = "dev" }
waterui-macros = { version = "0.3.0", git = "https://github.com/water-rs/waterui.git", branch = "dev" }
waterui-graphics = { version = "0.3.0", git = "https://github.com/water-rs/waterui.git", branch = "dev", features = ["gpu"] }
waterui-layout = { version = "0.3.0", git = "https://github.com/water-rs/waterui.git", branch = "dev" }
waterui-str = { version = "0.3.0", git = "https://github.com/water-rs/waterui.git", branch = "dev" }
tracing = "0.1.44"
# usvg's default features are `text`, `system-fonts` and `memmap-fonts`. The
# last two only widen `fontdb` (filesystem and fontconfig scanning,
# memory-mapped faces), and this crate never asks `fontdb` to read a file: it
# is handed a database or it parses with an empty one. They are off with no
# effect on output; see the feature table in README.md.
usvg = { version = "0.46.0", default-features = false }
kurbo = "0.13"
peniko = "0.6"

[dev-dependencies]
waterui = { git = "https://github.com/water-rs/waterui.git", branch = "dev" }
# The font catalogue of the machine running the tests, which is what the text
# fixtures are laid out with. It is a dev-dependency on purpose: reading the
# operating system's fonts is a caller's job, never the library's, so
# `fontdb`'s filesystem features stay out of the published dependency graph.
fontdb = "0.23"
waterui-testing = { git = "https://github.com/water-rs/waterui.git", branch = "dev" }
pollster = "1.0"
wgpu = "29.0.4"

[package.metadata.cargo-machete]
ignored = ["waterui-macros"]
