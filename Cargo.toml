[workspace]
resolver = "2"

[package]
name = "waterui-svg"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/svg"
description = "SVG rendering for WaterUI using the Cherenkov engine"
keywords = ["svg", "graphics", "waterui", "cherenkov"]
categories = ["gui"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[features]
# No text support by default: every known consumer of this crate draws icon
# geometry (`Svg::from_path`, `Svg::from_stroke_path`, icon sets), and the
# parser this crate uses carries no font database, so `usvg/text` would pull
# `fontdb`, `rustybuzz` and the `unicode-*` crates into every application for a
# code path that cannot produce a glyph. See README.md for the full table.
default = []
# Lay `<text>` out into outline paths. This is the only usvg feature that
# affects what this crate draws: with it off the parser drops `<text>`
# outright, with it on the text becomes the flattened outline group the
# renderer already draws. Enabling it also unlocks the font-taking
# constructors, which are the only way to give the parser a font to lay text
# out with.
text = ["usvg/text"]
# The mounted-runtime tests in `tests/e2e_semantics.rs`. They mount through
# `waterui-testing` against the pinned hydrolysis / hydrolysis-m3 cutover
# revisions, which implement the `SceneContent` contract.
host-e2e = []

[dependencies]
waterui-core = "0.5.0"
waterui-macros = "0.5.0"
waterui-graphics = { version = "0.5.0", features = ["gpu"] }
waterui-layout = "0.5.0"
suiteki = { version = "0.1", features = ["nami"] }
tracing = "0.1.44"
# usvg's default features are `text`, `system-fonts` and `memmap-fonts`. The
# last two only widen `fontdb` (filesystem and fontconfig scanning,
# memory-mapped faces), and this crate never asks `fontdb` to read a file: it
# is handed a database or it parses with an empty one. They are off with no
# effect on output; see the feature table in README.md.
usvg = { version = "0.48.1", default-features = false }
cherenkov = "0.0.0"

[dev-dependencies]
# The `cpu` feature adds the `OffscreenRenderer<Raster>` the snapshot tests
# compare the GPU render against.
waterui-graphics = { version = "0.5.0", features = ["cpu"] }

# Dev-deps for the `host-e2e` feature: `waterui-testing` mounts the view
# against a hydrolysis host, and `hydrolysis-m3` supplies the theme the tests
# style it with. The host crates ride the Cherenkov cutover revisions pinned
# in the patch table below.
waterui = "0.5.0"
waterui-testing = "0.5.0"
hydrolysis-m3 = "0.3.0"
pollster = "1.0"

[package.metadata.cargo-machete]
ignored = ["waterui-macros"]

# Registry dependencies do not carry their own patch table, so the framework's
# pins are repeated here for this graph to resolve the same sources as
# water-rs/waterui `dev` at the pinned revision: every `waterui-*` crate this
# crate reaches, directly or transitively, is the same monorepo commit, and
# the engine trio is the Cherenkov revision the port targets.
[patch.crates-io]
waterui-svg = { path = "." }
# The renderer-agnostic fork pins the framework relies on. `block` declares
# the Blocks ABI symbol as real storage; the `xcb` pin is the shared head the
# framework's other crates take.
block = { git = "https://github.com/Dicklesworthstone/rust-block", rev = "b39ae859d1ee8e8cb5eef6a516471f1578d26b96" }
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }

# nami#26 renamed `Signal::get` to `Signal::snapshot` — a breaking change with
# no compatibility path — so both nami crates this graph names ride the rev
# the framework pins, and the whole graph carries one `Signal` trait.
nami = { git = "https://github.com/water-rs/nami", rev = "f1db5017f5d64cb45b9b304c74ff420377258476" }
nami-core = { git = "https://github.com/water-rs/nami", rev = "f1db5017f5d64cb45b9b304c74ff420377258476" }

# The coordinated Cherenkov cutover (water-rs/hydrolysis#205). The recording
# API, engine-owned resources, layers and GPU content all live in the
# cherenkov workspace, which publishes nothing yet; `filtrate`/`filtrate-core`/
# `filtrate-derive` are the members the `.filter(F)` / `.effect(E)` types ride
# on, so every filtrate in the graph must come from this same revision or a
# filter type built on one side is a different type on the other.
cherenkov = { git = "https://github.com/water-rs/cherenkov", rev = "fd1e36660719bcf2ffecda4649c6243812f536ad" }
cherenkov-cpu = { git = "https://github.com/water-rs/cherenkov", rev = "fd1e36660719bcf2ffecda4649c6243812f536ad" }
cherenkov-gpu = { git = "https://github.com/water-rs/cherenkov", rev = "fd1e36660719bcf2ffecda4649c6243812f536ad" }
filtrate = { git = "https://github.com/water-rs/cherenkov", rev = "fd1e36660719bcf2ffecda4649c6243812f536ad" }
filtrate-core = { git = "https://github.com/water-rs/cherenkov", rev = "fd1e36660719bcf2ffecda4649c6243812f536ad" }
filtrate-derive = { git = "https://github.com/water-rs/cherenkov", rev = "fd1e36660719bcf2ffecda4649c6243812f536ad" }

# The framework head the port builds against: water-rs/waterui at
# e2c5e356 — the final scene-resource API, where `build_scene` gets a
# per-recording `RecordingResources` and names registrations through it
# (`Registered` is opaque; `Image::replace` is unreachable through it, so a
# new frame registers anew instead of swapping pixels in place). Every
# `waterui-*` crate in the graph must resolve to this one rev — a registry
# `waterui-core` beside the facade's own path dependencies gives two `View`
# traits in one graph.
waterui = { git = "https://github.com/water-rs/waterui", rev = "e2c5e356bc46ad90fde767234c3e7b772233f8da" }
waterui-assets = { git = "https://github.com/water-rs/waterui", rev = "e2c5e356bc46ad90fde767234c3e7b772233f8da" }
waterui-assets-core = { git = "https://github.com/water-rs/waterui", rev = "e2c5e356bc46ad90fde767234c3e7b772233f8da" }
waterui-controls = { git = "https://github.com/water-rs/waterui", rev = "e2c5e356bc46ad90fde767234c3e7b772233f8da" }
waterui-core = { git = "https://github.com/water-rs/waterui", rev = "e2c5e356bc46ad90fde767234c3e7b772233f8da" }
waterui-dylib = { git = "https://github.com/water-rs/waterui", rev = "e2c5e356bc46ad90fde767234c3e7b772233f8da" }
waterui-form = { git = "https://github.com/water-rs/waterui", rev = "e2c5e356bc46ad90fde767234c3e7b772233f8da" }
waterui-graphics = { git = "https://github.com/water-rs/waterui", rev = "e2c5e356bc46ad90fde767234c3e7b772233f8da" }
waterui-icon = { git = "https://github.com/water-rs/waterui", rev = "e2c5e356bc46ad90fde767234c3e7b772233f8da" }
waterui-internal = { git = "https://github.com/water-rs/waterui", rev = "e2c5e356bc46ad90fde767234c3e7b772233f8da" }
waterui-layout = { git = "https://github.com/water-rs/waterui", rev = "e2c5e356bc46ad90fde767234c3e7b772233f8da" }
waterui-locale = { git = "https://github.com/water-rs/waterui", rev = "e2c5e356bc46ad90fde767234c3e7b772233f8da" }
waterui-macros = { git = "https://github.com/water-rs/waterui", rev = "e2c5e356bc46ad90fde767234c3e7b772233f8da" }
waterui-media = { git = "https://github.com/water-rs/waterui", rev = "e2c5e356bc46ad90fde767234c3e7b772233f8da" }
waterui-navigation = { git = "https://github.com/water-rs/waterui", rev = "e2c5e356bc46ad90fde767234c3e7b772233f8da" }
waterui-shape = { git = "https://github.com/water-rs/waterui", rev = "e2c5e356bc46ad90fde767234c3e7b772233f8da" }
waterui-text = { git = "https://github.com/water-rs/waterui", rev = "e2c5e356bc46ad90fde767234c3e7b772233f8da" }
waterui-url = { git = "https://github.com/water-rs/waterui", rev = "e2c5e356bc46ad90fde767234c3e7b772233f8da" }
waterui-video = { git = "https://github.com/water-rs/waterui", rev = "e2c5e356bc46ad90fde767234c3e7b772233f8da" }
waterui-backend-core = { git = "https://github.com/water-rs/waterui", rev = "e2c5e356bc46ad90fde767234c3e7b772233f8da" }
waterui-inspector-protocol = { git = "https://github.com/water-rs/waterui", rev = "e2c5e356bc46ad90fde767234c3e7b772233f8da" }
waterui-map = { git = "https://github.com/water-rs/waterui", rev = "e2c5e356bc46ad90fde767234c3e7b772233f8da" }
waterui-mcp-protocol = { git = "https://github.com/water-rs/waterui", rev = "e2c5e356bc46ad90fde767234c3e7b772233f8da" }
waterui-preview-protocol = { git = "https://github.com/water-rs/waterui", rev = "e2c5e356bc46ad90fde767234c3e7b772233f8da" }
waterui-testing = { git = "https://github.com/water-rs/waterui", rev = "e2c5e356bc46ad90fde767234c3e7b772233f8da" }
waterui-watcher-set = { git = "https://github.com/water-rs/waterui", rev = "e2c5e356bc46ad90fde767234c3e7b772233f8da" }
waterui-webview = { git = "https://github.com/water-rs/waterui", rev = "e2c5e356bc46ad90fde767234c3e7b772233f8da" }

