[workspace]
resolver = "2"

[package]
name = "waterui-svg"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/svg"
description = "SVG rendering for WaterUI"
keywords = ["svg", "graphics", "waterui", "cherenkov"]
categories = ["gui"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[features]
# No text support by default: every known consumer of this crate draws icon
# geometry (`Svg::from_path`, `Svg::from_stroke_path`, icon sets), and the
# parser this crate uses carries no font database, so `usvg/text` would pull
# `fontdb`, `rustybuzz` and the `unicode-*` crates into every application for a
# code path that cannot produce a glyph. See README.md for the full table.
default = []
# Lay `<text>` out into outline paths. This is the only usvg feature that
# affects what this crate draws: with it off the parser drops `<text>`
# outright, with it on the text becomes the flattened outline group the
# renderer already draws. Enabling it also unlocks the font-taking
# constructors, which are the only way to give the parser a font to lay text
# out with.
text = ["usvg/text"]

# The requirements below are the versions the pinned framework revision
# declares; they move to the published lines when the `[patch.crates-io]`
# pins drop after the release. A lower requirement cannot resolve to a
# newer patch — cargo checks a patch's declared version against the
# requirement.
[dependencies]
waterui-core = "0.5.1"
waterui-macros = "0.5.1"
# `default-features = false` drops `gpu`: the crate only records into
# `waterui_graphics::draw`, so the engine crates stay out of a default
# build. The scene-engine tests opt back into the engines below.
waterui-graphics = { version = "0.5.1", default-features = false }
waterui-layout = "0.5.1"
suiteki = { version = "0.1", features = ["nami"] }
tracing = "0.1.44"
# usvg's default features are `text`, `system-fonts` and `memmap-fonts`. The
# last two only widen `fontdb` (filesystem and fontconfig scanning,
# memory-mapped faces), and this crate never asks `fontdb` to read a file: it
# is handed a database or it parses with an empty one. They are off with no
# effect on output; see the feature table in README.md.
usvg = { version = "0.48.1", default-features = false }

[dev-dependencies]
# The scene-engine test renders the same document through the Cherenkov GPU
# engine and the CPU rasteriser, so the tests need the engine-backed half of
# the graphics crate even though the crate itself records without one.
waterui-graphics = { version = "0.5.1", features = ["gpu", "cpu"] }

waterui = "0.5.2"
waterui-testing = "0.5.1"
# The style the rendered (geometry-answering) test session is mounted with.
hydrolysis-m3 = "0.3.1"
pollster = "1.0"

[package.metadata.cargo-machete]
ignored = ["waterui-macros"]

# Registry dependencies do not carry their own patch table, so the framework's
# pins are repeated here for this graph to resolve the same sources as
# water-rs/waterui `dev` at the pinned revision: every `waterui-*` crate this
# crate reaches, directly or transitively, is the same monorepo commit, and
# the `cherenkov`/`filtrate` family is that revision's in-tree crates.
[patch.crates-io]
waterui-svg = { path = "." }
# The renderer-agnostic fork pins the framework relies on. `block` declares
# the Blocks ABI symbol as real storage; the `xcb` pin is the shared head the
# framework's other crates take.
block = { git = "https://github.com/Dicklesworthstone/rust-block", rev = "b39ae859d1ee8e8cb5eef6a516471f1578d26b96" }
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }

# nami#26 renamed `Signal::get` to `Signal::snapshot` — a breaking change with
# no compatibility path — so both nami crates this graph names ride the rev
# the framework pins, and the whole graph carries one `Signal` trait.
nami = { git = "https://github.com/water-rs/nami", rev = "f1db5017f5d64cb45b9b304c74ff420377258476" }
nami-core = { git = "https://github.com/water-rs/nami", rev = "f1db5017f5d64cb45b9b304c74ff420377258476" }

# The `cherenkov`/`filtrate` crates live in water-rs/waterui under
# `graphics/` (water-rs/waterui#1449). Crates outside that workspace declare
# them as crates.io requirements — `cherenkov` is unpublished and the
# published `filtrate` release is an older API — so the requirements resolve
# to the in-tree sources instead. Every filtrate in the graph must come from
# one source: a filter type built on the published crate is a different type
# from one built in-tree.
cherenkov = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
cherenkov-cpu = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
cherenkov-gpu = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
filtrate = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
filtrate-core = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
filtrate-derive = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }

# The framework head the port builds against: water-rs/waterui `dev` at
# 0b982961, carrying the render-target-neutral recording contract
# (water-rs/waterui#1435): `SceneContent::build_scene` records into
# `waterui_graphics::draw` — the `cherenkov_record` vocabulary — and
# `SceneResources` registers through the target's `SceneBackend` /
# `ShaderBackend` registry, so a component links no engine unless it turns
# on `waterui-graphics`' `gpu`/`cpu`/`cherenkov` features. Every
# `waterui-*` crate in the graph must resolve to this one rev — a registry
# `waterui-core` beside the facade's own path dependencies gives two `View`
# traits in one graph.
waterui = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-assets = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-assets-core = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-controls = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-core = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-dylib = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-form = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-graphics = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-icon = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-internal = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-layout = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-locale = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-macros = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-media = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-navigation = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-shape = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-text = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-url = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-video = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-backend-core = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-inspector-protocol = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-map = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-mcp-protocol = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-preview-protocol = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-testing = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-watcher-set = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }
waterui-webview = { git = "https://github.com/water-rs/waterui", rev = "0b9829612f63fec5c66fbb80890314c5d6c24377" }

# The extracted component crates the facade and the test graph name: each
# rides its current `dev` head. `waterui-svg` itself is the local crate,
# patched at the top of the table.
waterui-math = { git = "https://github.com/water-rs/math", rev = "c28149e8fafe393fe8189f06eb8827df4177fd52" }
waterui-image = { git = "https://github.com/water-rs/image", rev = "8b1aa2ce3f03d81ca02164f5563f2cefc34fb566" }
waterui-barcode = { git = "https://github.com/water-rs/barcode", rev = "a0570f2bf56cec58fc04522e085be5dbbe634a33" }
