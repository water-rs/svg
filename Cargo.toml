[workspace]
resolver = "2"

[package]
name = "waterui-svg"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/svg"
description = "SVG rendering for WaterUI using Vello"
keywords = ["svg", "graphics", "waterui", "vello"]
categories = ["gui"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[features]
# No text support by default: every known consumer of this crate draws icon
# geometry (`Svg::from_path`, `Svg::from_stroke_path`, icon sets), and the
# parser this crate uses carries no font database, so `usvg/text` would pull
# `fontdb`, `rustybuzz` and the `unicode-*` crates into every application for a
# code path that cannot produce a glyph. See README.md for the full table.
default = []
# Lay `<text>` out into outline paths. This is the only usvg feature that
# affects what this crate draws: with it off the parser drops `<text>`
# outright, with it on the text becomes the flattened outline group the
# renderer already draws. Enabling it also unlocks the font-taking
# constructors, which are the only way to give the parser a font to lay text
# out with.
text = ["usvg/text"]

[dependencies]
waterui-core = "0.3.0"
waterui-macros = "0.3.0"
waterui-graphics = { version = "0.3.0", features = ["gpu"] }
waterui-layout = "0.3.0"
waterui-str = "0.3.0"
tracing = "0.1.44"
# usvg's default features are `text`, `system-fonts` and `memmap-fonts`. The
# last two only widen `fontdb` (filesystem and fontconfig scanning,
# memory-mapped faces), and this crate never asks `fontdb` to read a file: it
# is handed a database or it parses with an empty one. They are off with no
# effect on output; see the feature table in README.md.
usvg = { version = "0.48.1", default-features = false }
kurbo = "0.13"
peniko = "0.6"

[dev-dependencies]
waterui-graphics = { version = "0.3.0", features = ["cpu-scene"] }
waterui = "0.3.0"
waterui-testing = "0.3.0"
pollster = "1.0"
wgpu = "29.0.4"

[package.metadata.cargo-machete]
ignored = ["waterui-macros"]

# Development and CI certify one immutable WaterUI foundation revision: every
# framework package in the graph comes from the same commit, and the framework's
# own dependency patches are mirrored so the graph matches what that commit
# builds. The published requirements above remain the distribution contract;
# Cargo only applies patches from the consuming graph's root manifest.
[patch.crates-io]
hydrolysis = { git = "https://github.com/water-rs/waterui.git", rev = "3255af7d4763033f543d31d1d5988501f8013dce" }
hydrolysis-m3 = { git = "https://github.com/water-rs/waterui.git", rev = "3255af7d4763033f543d31d1d5988501f8013dce" }
